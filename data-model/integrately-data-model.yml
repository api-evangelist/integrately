  note: Not probed - requires an authenticated Integrately account.
id_prefixes:
  observed: false
  note: Integrately uses bare integer ids with no type prefix (no "app_", "tpl_" convention), so an id
    carries no self-describing type information. installationCode is the one opaque string token.
