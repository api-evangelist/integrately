source: live JSON responses from https://embed.integrately.com (see components/integrately-components.yml)
provider: Integrately
providerId: integrately
description: Entity-relationship graph for Integrately's automation catalog, DERIVED from the JSON records
  actually returned by the three endpoints behind Integrately's public embed widget on 2026-09-13. There
  is no OpenAPI, no JSON Schema and no published object reference to derive from, so every field listed
  below was observed in a real response body. Fields Integrately did not return are not listed, and no
  entity is inferred that was not seen.
caveat: This describes the PUBLIC CATALOG that the embed widget browses - apps, their triggers and actions,
  and the ready-made automation templates that join them. It does NOT describe a user's own automations,
  runs, connections or task ledger; those live behind the authenticated application at app.integrately.com
  and were not probed.
