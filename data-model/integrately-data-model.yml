    type: boolean
  - name: isSubsequentStepRequired
    type: boolean
  - name: supportsOutputFieldsFromResponse
    type: boolean
  - name: recordIdentifierKey
    type: string
    note: The field Integrately treats as the record key, e.g. "rowid" for a Google Sheets row.
  - name: errorOnDuplicateEntry
