description: >-
  Published subscription tiers for the Integrately workflow-automation platform. Integrately meters
  on "tasks" — every successful action, condition/branch, inline or standalone Modify Data, and
  Search execution counts as one task; triggers and failed actions are explicitly free. Prices are
  USD. Two billing bases are published for every paid tier: a monthly-billed price and a lower
  monthly-equivalent price when billed annually.
currency: USD
metered_unit: task
metered_unit_definition: >-
  "Every successful execution of action, condition / branching, modify data (inline in an action or
  independent step), search (inline in an action or independent step) is counted as a task. Triggers
  are free. Failed actions are also NOT counted." — integrately.com/pricing FAQ
quota_exhaustion_behavior: >-
  Automations are not disabled when the task quota is exhausted; actions stop executing and records
  queue inside Integrately, and execution can be resumed from the History page once tasks are
  replenished or the plan is upgraded.
