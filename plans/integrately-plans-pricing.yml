  per-minute rate limits and an invented Enterprise tier. Every value below is read from the
  provider's own pricing page: the tier names, task quotas, polling ("Update Time") intervals and
  feature caps from the rendered comparison table, and the monthly-billed prices from the
  schema.org/AggregateOffer JSON-LD block embedded in that same page (priceSpecification[], which
  is why method is `probed` rather than `searched`). Integrately publishes NO developer API plans —
  these are product subscription tiers for the workflow-automation platform itself. Task quota is
  the metered unit, not API calls.
