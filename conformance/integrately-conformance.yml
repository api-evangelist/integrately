  note: >-
    REWARD-ONLY, and nothing to reward here honestly. The iPaaS / workflow-automation market has no
    interoperability standard an integration platform declares in its contract — there is no SCIM,
    OData, OpenRTB, Sparkplug, ActivityPub, LTI, OAI-PMH, HL7, X12 or ISO 20022 analogue for
