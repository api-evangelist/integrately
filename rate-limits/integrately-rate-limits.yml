policies:
  - name: Quota exhaustion
    description: >-
      Published behaviour: automations are not switched off when the task allowance runs out.
      Actions stop executing and records accumulate inside Integrately; execution can be resumed
      from the History page once tasks are replenished or the plan is upgraded.
    source: https://integrately.com/pricing
  - name: AutoRetry
    description: >-
      Integrately automatically retries records that failed in the previous 24 hours when a failing
      automation is corrected and set live again. When a connected app is unavailable, Integrately
      continues attempting to reach it for approximately 10.5 hours.
    source: https://integrately.com/docs#autoretry-What-is-it
  - name: What counts against the allowance
    description: >-
      Successful actions, conditions/branches, Modify Data (inline or standalone) and Search
      (inline or standalone) each consume one task. Triggers are free; failed actions are not
      counted.
    source: https://integrately.com/pricing
