  - Workflows
  - Rate Limiting
  - Quotas
  - Throttling
description: >-
  Published consumption limits for the Integrately platform. The metered unit is the "task" — each
  successful action, condition/branch, Modify Data and Search execution. Triggers and failed actions
  are free. A second published limit is the polling interval at which Integrately checks connected
  apps for new trigger data, which tightens from 15 minutes on Free to 2 minutes on the top tiers.
headers:
  published: false
  observed: []
  note: >-
    No rate-limit response headers are documented (there is no developer API reference to document
    them in), and none were observed on a live 200 from https://embed.integrately.com/apps on
    2026-09-13. Response headers returned were: date, content-type, server (cloudflare),
    x-runtime-action, x-content-type-options, x-frame-options,
    x-permitted-cross-domain-policies, x-xss-protection, strict-transport-security, x-runtime,
    x-powered-by, cf-cache-status, report-to, nel, cf-ray, alt-svc. No X-RateLimit-*, no
    RateLimit-*, no Retry-After.
responseCodes:
  published: false
  observed:
    - code: 429
      where: https://integrately.com/blog
      note: >-
        Observed 2026-09-13 — Cloudflare edge rate limiting applied to an automated fetch of the
        marketing blog path. This is edge bot policy, not a documented API throttle, and is
        recorded as an observation only.
