created: '2026-05-04'
modified: '2026-09-13'
generated: '2026-09-13'
method: searched
source: https://integrately.com/pricing
note: >-
  REPLACES a 2026-05-04 bulk-sweep scaffold that invented per-minute request limits, burst
  ceilings, X-RateLimit-* response headers and an enterprise tier. None of those are published by
  Integrately. Integrately has no public developer API and therefore publishes no HTTP rate limits.
  What it DOES publish, per subscription tier, is a monthly TASK allowance and a polling interval
  ("Update Time") — those are the real, provider-published consumption limits and are recorded
  below. The one live JSON surface this repo could probe (embed.integrately.com, the public backing
  API for the embeddable automation widget) returned no rate-limit headers of any kind on a 200.
