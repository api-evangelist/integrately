description: >-
  Operational lifecycle posture for Integrately. This is a record of ABSENCES backed by probes.
  Integrately publishes no API, no versioning policy, no deprecation policy, no SLA, no changelog
  and no working status page. Each of those is recorded with the URL and HTTP status that
  establishes it, so a later run can tell "checked and not there" from "never checked".
versioning:
  published: false
  scheme: null
  note: >-
    No API version scheme is published because no API is published. The product itself is versioned
    silently — the web app is a continuously deployed SPA.
deprecation_policy:
  published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    No deprecation or sunset policy found on the site, in the help centre, or in the terms of use.
    RFC 8594 Sunset/Deprecation headers were not observed on any probed response.
sla:
  published: false
  note: >-
    No uptime commitment, credit schedule or support-response SLA is published. The pricing table
    states support CHANNEL by tier (24*5 live chat on Free through Professional; a dedicated
    account manager plus live chat on Growth and Business) but attaches no response-time target.
  source: https://integrately.com/pricing
status_page:
  published: false
  probed_url: https://status.integrately.com/
  http_status: 200
  vendor: Freshping
  verdict: dead
  note: >-
    status.integrately.com resolves and returns HTTP 200, but the body is the Freshping placeholder
    "Status page for domain name does not exist". This is a soft-404: the subdomain points at a
    status-page vendor that has no page configured for it. It is NOT a status page and no
    StatusPage pointer is wired into apis.yml. This is exactly the failure mode that makes a
    pointer's mere presence untrustworthy — a reader who followed the subdomain would conclude
    Integrately publishes status when it does not.
  fetched: '2026-09-13'
